[package]
name = "tetris"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = "0.4"
screenshot = { path = "../../lib/screenshot" }
control = { path = "../../lib/control" }
render_cache = { path = "../../lib/render_cache" }
game_common = { path = "../../lib/game_common" }
beam_solver = { path = "../../lib/beam_solver" }
audio = { path = "../../lib/audio" }

[features]
# Opt-in gameplay clip capture — see mise.toml's clip task and lib/screenshot's `stream`
# feature (Y4M frames over a named pipe, no intermediate files).
stream = ["screenshot/stream"]
