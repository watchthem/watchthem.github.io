[env]
WASM_TARGET = "wasm32-unknown-unknown"
MQ_JS = "https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"

# Run a game natively: mise run run snake
[tasks.run]
description = "Run a game natively"
run = """
#!/usr/bin/env bash
cargo run --release --bin "$1"
"""

# Run a game out of the merged binary natively: mise run run-bundle snake
[tasks.run-bundle]
description = "Run one game through the merged multi-game binary (bundle/) natively — the same dispatch path the browser takes. Per-game CLI flags live on the per-game binary (`mise run run <name>`) instead"
run = """
#!/usr/bin/env bash
cargo run --bin hcg -- --game "$1"
"""

# Build the one shared all-games wasm: mise run build-bundle
[tasks.build-bundle]
description = "Compile bundle/ (every game in one binary, game chosen at runtime) to dist/hcg.wasm — the single wasm every game page loads; skips wasm-opt when the build didn't change"
run = """
#!/usr/bin/env bash
set -euo pipefail
mkdir -p dist
RUSTFLAGS="-C link-arg=--import-undefined" cargo build --target "$WASM_TARGET" --release --bin hcg

# Cargo only rewrites this file's mtime when it actually rebuilt the binary (a no-op
# build leaves it untouched), so comparing it against the previous dist/ copy is a
# reliable, dependency-graph-aware "did anything change" check — covering every game and
# every shared lib/ crate, since the bundle depends on all of them.
src="target/$WASM_TARGET/release/hcg.wasm"
out="dist/hcg.wasm"
if [ -f "$out" ] && [ ! "$src" -nt "$out" ]; then
  echo "bundle: wasm unchanged, skipping wasm-opt" >&2
else
  # --all-features made wasm-opt enable engine features (reference-types, multivalue,
  # ...) beyond what rustc's wasm32-unknown-unknown target actually emits, and combining
  # them corrupted the type section ("wasm validation error ... bad type" in the
  # browser). Pass only the 4 features this target really uses.
  if command -v wasm-opt >/dev/null; then
    wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-mutable-globals --enable-sign-ext \
      -o "$out" "$src"
  else
    cp "$src" "$out"
  fi
fi
# Shared across all games (dist/mq_js_bundle.js, not dist/<name>/) so it's fetched and
# stored once total instead of once per game — and, since dist/ now persists between
# deploys (see [tasks.deploy]), once ever rather than once per deploy.
[ -f dist/mq_js_bundle.js ] || curl -sSfL "$MQ_JS" -o dist/mq_js_bundle.js
"""

# Stage one game's page + preview: mise run build-wasm snake
[tasks.build-wasm]
description = "Stage one game in dist/<name>/: its page (index.html + manifest) and its gameplay preview. No longer builds a per-game wasm — every page loads the shared dist/hcg.wasm from `mise run build-bundle` instead. Skips the screenshot when the game's sources haven't changed and HTML regen when xtask's generator hasn't, independently"
run = """
#!/usr/bin/env bash
set -euo pipefail
name=$1
mkdir -p "dist/$name"

# Same no-op-build-leaves-mtime-untouched trick as build-bundle's check, applied to
# xtask itself — so editing xtask/src/lib.rs (the HTML templates) forces regeneration
# even for a game whose own code didn't change, without needing `mise run clean`.
cargo build --release --package xtask --bin generate_game_html
xtask_bin="target/release/generate_game_html"

html_out="dist/$name/index.html"
shot_out="dist/$name/preview.png"

# Two independent checks, not one combined — the screenshot only cares whether the game's
# own code changed (a screenshot is pixels of gameplay, unaffected by page-chrome
# HTML/CSS/JS), while HTML regen only cares whether xtask's generator changed. Bundling
# both behind a single check used to force a full xvfb screenshot recapture for every
# game on the next build-wasm after ANY xtask/src/lib.rs edit — including page-chrome-only
# changes (a CSS tweak, a new hotkey-popup link) with zero effect on rendered gameplay.
#
# Source mtimes, not a cargo artifact's: the old check compared this game's built wasm
# against its dist/ copy, but per-game wasm builds are gone (see build-bundle), and the
# obvious substitute — the native release binary — thrashes, because the clip task builds
# the same path with `--features stream` and the screenshot task without, so its mtime
# changes on every alternate run regardless of source edits.
if [ -f "$shot_out" ] && \
   [ -z "$(find "games/$name" lib Cargo.lock -name target -prune -o -newer "$shot_out" -print -quit)" ]; then
  echo "$name: sources unchanged, skipping screenshot" >&2
else
  mise run screenshot "$name"
fi
if [ -f "$html_out" ] && [ ! "$xtask_bin" -nt "$html_out" ]; then
  echo "$name: xtask templates unchanged, skipping HTML regen" >&2
else
  cargo run --release --package xtask --bin generate_game_html -- "$name"
fi
# Left over from the per-game-wasm era: dist/ persists between deploys, so an old
# dist/<name>/<name>.wasm would otherwise sit there forever, served to nobody.
rm -f "dist/$name/$name.wasm"
"""

# Capture a representative in-game screenshot: mise run screenshot snake
[tasks.screenshot]
description = "Capture dist/<name>/preview.png (+ resized preview-<w>.png srcset tiers) by running the native build headless for a few seconds (needs xvfb-run; runs automatically in CI, skipped locally if unavailable)"
run = """
#!/usr/bin/env bash
set -euo pipefail
name=$1
mkdir -p "dist/$name"
if command -v xvfb-run >/dev/null 2>&1; then
    HCG_SEED=42 HCG_SCREENSHOT="dist/$name/preview.png" xvfb-run -a cargo run --release --bin "$name"
    # Responsive tiers for the game-grid card srcset (see generate_index.rs's
    # preview_srcset) — one invocation writes all of them, since the widths are fractions
    # of this game's own preview rather than a fixed list (see resize_preview's
    # TIER_FRACTIONS). The full-size preview.png stays untouched: the wall and the OG image
    # both use it. Stale tiers are cleared first, or a width that's no longer generated
    # would linger in dist/ (which persists between local runs) and be picked up by the
    # srcset, since that reads whatever preview-<w>.png files it finds.
    rm -f "dist/$name"/preview-small.png "dist/$name"/preview-[0-9]*.png
    cargo run --release --package xtask --bin resize_preview -- \
        "dist/$name/preview.png" "dist/$name"
else
    echo "xvfb-run not found — skipping screenshot for $name (runs automatically in CI)" >&2
fi
"""

# Capture a gameplay clip: mise run clip tetris [-- extra game CLI args, e.g. --variant score]
[tasks.clip]
description = "Generate dist/<name>/clip.mp4: a muted ~15s loopable MP4, streamed as Y4M frames over a named pipe straight from a native headless run into ffmpeg (no intermediate frame files; needs xvfb-run + ffmpeg; runs automatically in CI, skipped locally if unavailable; skips if the game's wasm hasn't changed since the last clip). Extra args after the name are forwarded to the game's own CLI (e.g. --variant/--level) to pin a specific stage/mode for the capture."
run = """
#!/usr/bin/env bash
set -euo pipefail
name=$1
shift
mkdir -p "dist/$name"
out="dist/$name/clip.mp4"
# Source mtimes rather than the built wasm this used to compare against: per-game wasm
# builds are gone (every page loads the shared dist/hcg.wasm, see build-bundle), and the
# native binary's mtime is unusable here because this task builds it with
# `--features stream` and the screenshot task builds the same path without.
if [ -f "$out" ] && \
   [ -z "$(find "games/$name" lib Cargo.lock -name target -prune -o -newer "$out" -print -quit)" ]; then
    echo "$name: sources unchanged, skipping clip" >&2
    exit 0
fi
if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
    echo "xvfb-run/ffmpeg not found — skipping clip for $name (runs automatically in CI)" >&2
    exit 0
fi
# Named pipe, not a temp dir of numbered PNGs: the game (built with --features stream)
# writes Y4M frames straight to this FIFO — no intermediate files, no PNG encode/decode
# round-trip. ffmpeg must already be reading it before the game opens it for writing, or
# that open() blocks forever (FIFO open-for-write blocks until a reader attaches).
fifo_dir="$(mktemp -d)"
fifo="$fifo_dir/clip.y4m"
mkfifo "$fifo"
trap 'rm -rf "$fifo_dir"' EXIT

# H.264 stays the codec (not HEVC/AV1) since this feeds og:video — Facebook's crawler
# requires H.264, and Discord/Slack/Twitter unfurl support for HEVC/AV1-in-MP4 is still
# spotty. `-tune animation` fits this content specifically (flat solid-color UI/board
# cells, not filmed video) — raises deblocking strength and ref-frame use for exactly
# that kind of source, at negligible cost regardless of preset. `-crf 18` (below the
# default 23) for a real quality bump; file size stays trivial either way (~100-200KB/15s)
# since the content compresses this well regardless.
#
# Preset is `medium` (ffmpeg's own default), not `veryslow`: this ffmpeg runs
# *concurrently* with the game process (both under xvfb-run, competing for the same
# cores), fed frame-by-frame through a pipe whose OS buffer (64KB) is far smaller than
# one Y4M frame (~1.3MB) — so `veryslow`'s much heavier per-frame search (ref=16 vs
# medium's ref=3, me=umh vs hex, ...) shows up as real wall-clock time here, unlike a
# batch pass over an already-complete file where the same setting is sub-second.
# Measured on tetris (same pipe, same crf/tune, only preset varied): `veryslow` added
# ~1s to the ~16s floor (game's own 15s capture window + startup/mux overhead) for a
# ~19% smaller file (100KB vs ~118KB) — a bad trade for output this small already.
ffmpeg -y -f yuv4mpegpipe -i "$fifo" -vf "format=yuv420p" \
    -c:v libx264 -preset medium -tune animation -crf 18 -movflags +faststart -an "$out" &
ffmpeg_pid=$!

HCG_SEED=42 HCG_CLIP_FIFO="$fifo" HCG_CLIP_SECS=15 HCG_CLIP_FPS=10 xvfb-run -a cargo run --release --features stream --bin "$name" -- "$@"

wait "$ffmpeg_pid"
"""

# Rasterize SVG art to PNG: mise run rasterize
[tasks.rasterize]
description = "Rasterize static/hotel-scene.svg and static/favicon.svg to PNG, plus favicon.ico and apple-touch-icon.png (needs resvg or rsvg-convert; runs automatically in CI, skipped locally if neither is available; skips per-file if already up to date)"
run = """
#!/usr/bin/env bash
set -euo pipefail

# resvg preferred (matches CI); rsvg-convert (librsvg, often already present on Linux
# desktops/distros without a separate resvg install) as a fallback with the same effect —
# without one of these, dist/favicon.png and dist/icon-512.png never exist locally, which
# silently drops the PWA manifest down to its SVG-only icon and fails Chrome's
# installability check (it wants a numeric-sized icon >=192px, and manifest_json's
# "sizes":"any" SVG entry doesn't count) — so no install prompt locally even though the
# manifest itself is otherwise valid.
if command -v resvg >/dev/null 2>&1; then
    svg_to_png() { resvg "$1" "$2" --width "$3" --height "$4"; }
elif command -v rsvg-convert >/dev/null 2>&1; then
    svg_to_png() { rsvg-convert -w "$3" -h "$4" "$1" -o "$2"; }
else
    echo "neither resvg nor rsvg-convert found — skipping SVG rasterization (runs automatically in CI)" >&2
    exit 0
fi

if [ ! -f dist/og-image.png ] || [ static/hotel-scene.svg -nt dist/og-image.png ]; then
    svg_to_png static/hotel-scene.svg dist/og-image.png 1200 900
fi
if [ ! -f dist/favicon.png ] || [ static/favicon.svg -nt dist/favicon.png ]; then
    svg_to_png static/favicon.svg dist/favicon.png 192 192
fi
# PWA manifest large icon (see xtask::manifest_json) — same source art, just bigger.
if [ ! -f dist/icon-512.png ] || [ static/favicon.svg -nt dist/icon-512.png ]; then
    svg_to_png static/favicon.svg dist/icon-512.png 512 512
fi
# PWA manifest maskable icon (see xtask::manifest_json) — safe-zone-padded + opaque-bg
# variant so Android/adaptive-icon installs don't letterbox-crop the artwork.
if [ ! -f dist/icon-512-maskable.png ] || [ static/favicon-maskable.svg -nt dist/icon-512-maskable.png ]; then
    svg_to_png static/favicon-maskable.svg dist/icon-512-maskable.png 512 512
fi
# /apple-touch-icon.png: iOS requests this path directly when a page is added to the home
# screen, on top of any <link rel="apple-touch-icon"> favicon_links emits, and crawlers
# probe for it too. Sourced from the maskable variant, not favicon.svg — iOS composites a
# transparent icon onto black and applies its own rounded-square mask, so an opaque,
# safe-zone-padded source is the one that survives both.
if [ ! -f dist/apple-touch-icon.png ] || [ static/favicon-maskable.svg -nt dist/apple-touch-icon.png ]; then
    svg_to_png static/favicon-maskable.svg dist/apple-touch-icon.png 180 180
fi
# /favicon.ico: browsers and Googlebot-Image request this exact path unconditionally,
# whatever <link rel="icon"> tags the page carries — 2 of the 21 requests in the
# 2026-08-10 Search Console crawl-stats export were 404s on this and apple-touch-icon.png.
# Built as a 32x32 PNG inside a 22-byte ICO container (the Vista+ PNG-compressed form,
# read by every current browser) so it needs no encoder beyond the rasterizer above.
if command -v python3 >/dev/null 2>&1; then
    if [ ! -f dist/favicon.ico ] || [ static/favicon.svg -nt dist/favicon.ico ]; then
        ico_src="$(mktemp -t hcg-favicon-XXXXXX.png)"
        svg_to_png static/favicon.svg "$ico_src" 32 32
        python3 - "$ico_src" dist/favicon.ico <<'PY'
import struct, sys

png = open(sys.argv[1], "rb").read()
# ICONDIR(reserved, type=icon, count) + ICONDIRENTRY(w, h, palette, reserved, planes,
# bpp, byte length, offset past this 22-byte header).
header = struct.pack("<HHHBBBBHHII", 0, 1, 1, 32, 32, 0, 0, 1, 32, len(png), 22)
open(sys.argv[2], "wb").write(header + png)
PY
        rm -f "$ico_src"
    fi
else
    echo "python3 not found — skipping dist/favicon.ico (runs automatically in CI)" >&2
fi
"""

# Generate the homepage + sitemap.xml: mise run generate-index
[tasks.generate-index]
description = "Generate dist/index.html and dist/sitemap.xml"
run = "cargo run --release --package xtask --bin generate_index"

# Build all games and generate dist/: mise run deploy
[tasks.deploy]
description = "Build all games and prepare dist/ for deployment (incremental — dist/ persists between runs so unchanged games/assets are skipped, including detecting xtask template edits; run `mise run clean` first to force a full rebuild for any other reason, e.g. fresh screenshots)"
run = """
#!/usr/bin/env bash
set -euo pipefail
shopt -s nullglob
mkdir -p dist
cp -r static/* dist/
# Drop any dist/<name>/ that no longer has a source — a game renamed/removed from
# games/, or a redirect stub removed from static/ (e.g. static/minesweeper-hex/) — now
# that dist/ no longer gets wiped wholesale, this is the only cleanup.
for dir in dist/*/; do
    name="$(basename "$dir")"
    [ -d "games/$name" ] || [ -d "static/$name" ] || rm -rf "$dir"
done
mise run rasterize
# One wasm for every game (bundle/), built once — each game page just bakes its own id
# into the shared binary. Must run before the per-game loop only in spirit; the pages it
# generates reference dist/hcg.wasm by name either way.
mise run build-bundle
for game in games/*/; do
    mise run build-wasm "$(basename "$game")"
done
# Gameplay clips are opt-in per game (see mise.toml's clip task) — add a game to this
# list once it has one; not every game does yet. Extra args pin a specific stage/mode
# so the capture shows something representative rather than whatever a fresh session
# starts at (level 0 / a random Auto variant).
mise run clip tetris
mise run clip bubble-shooter --level 3
mise run clip minesweeper --variant hex
mise run clip match-3 --variant score
mise run clip game2048
# Fog: the misty forest is the labyrinth's most striking look.
mise run clip labyrinth --variant fog
mise run generate-index
"""

# Force a full rebuild on the next deploy/build-wasm: mise run clean
[tasks.clean]
description = "Remove dist/ so the next build-wasm/deploy fully regenerates everything (screenshots included) instead of skipping games whose wasm and xtask templates are both unchanged"
run = "rm -rf dist"

# Manually ping IndexNow (Bing, Yandex, Seznam, Naver — not Google). No args submits every
# page in the live sitemap; or pass specific URLs:
#   mise run indexnow https://watchthem.github.io/labyrinth/
# Deliberately not part of deploy: only submit pages that actually changed. The key is
# public by design, verified against static/<key>.txt at the site root.
[tasks.indexnow]
description = "Submit live URLs to IndexNow (default: every page in the live sitemap)"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ $# -gt 0 ]; then
  printf '%s\\n' "$@"
else
  curl -sSf https://watchthem.github.io/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//'
fi \
  | jq -Rn --arg host watchthem.github.io --arg key 45afa912b5705cb064d956a30cb52a97 \
      '{host: $host, key: $key, urlList: [inputs]}' \
  | curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow \
      -H 'Content-Type: application/json; charset=utf-8' --data-binary @- \
      -w 'HTTP %{http_code}\\n'
"""

# Serve dist/ locally (WASM requires HTTP — can't open via file://)
[tasks.serve]
description = "Serve dist/ on http://localhost:8080"
run = "python3 -m http.server 8080 --directory dist"

# Fast checks, run by the pre-commit hook: mise run check
[tasks.check]
description = "Format + lint check (used by the pre-commit hook, see .githooks/pre-commit)"
run = """
#!/usr/bin/env bash
set -euo pipefail
cargo fmt --all -- --check
cargo clippy --workspace --all-targets -- -D warnings
"""
